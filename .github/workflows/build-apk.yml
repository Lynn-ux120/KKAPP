name: Build Android APK

# 为什么用 GitHub Actions：Buildozer / python-for-android 只能在 Linux 上运行，
# Windows 本机没有 WSL/Docker 时无法直接打包。这里在云端 Linux 上构建，
# 产出的 APK 作为 Artifact 供下载。

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "icon.png"
      - "**.jpg"
      - "**.ogg"
      - "**.otf"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK/NDK 有 1~2 GB，缓存下来可以让后续构建快很多
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-v1
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            build-essential ccache \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev uuid-dev libgdbm-dev
          # libtinfo5 在部分镜像里已移除，装不上不影响构建
          sudo apt-get install -y libtinfo5 || true

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel
          # Cython 3.x 会破坏 p4a 里 pygame/kivy 等配方的编译，必须锁在 3.0 以下
          python -m pip install "Cython<3.0" "setuptools<71" buildozer

      - name: Show environment
        run: |
          python --version
          java -version
          buildozer version

      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
        run: |
          yes | buildozer -v android debug

      - name: List build output
        if: always()
        run: ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kunkundaotao-apk
          path: bin/*.apk
          if-no-files-found: error

      # 失败时把日志一并传上来，方便定位是哪一步挂了
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            bin/*.log
            .buildozer/android/platform/*.log
          if-no-files-found: ignore
